# Weekly dependency update pull requests. Minor and patch updates are grouped into one PR per
# ecosystem; major updates arrive separately so they can be reviewed on their own. A new release
# waits 7 days (cooldown) before it is proposed, so a hijacked release is likely pulled first.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned deliberately (exact versions in Cargo.toml): update by hand after review.
      - dependency-name: openqbw
      - dependency-name: opensqlany
      - dependency-name: sha2
      - dependency-name: hmac

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned deliberately; the icon registry in src/lib/icons.js is checked against this version.
      - dependency-name: lucide-react

  # End-to-end test tooling (WebdriverIO); never ships in the app.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
