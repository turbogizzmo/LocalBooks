# Weekly dependency update pull requests. Minor and patch updates are grouped into one PR per
# ecosystem; major updates arrive separately so they can be reviewed on their own. A new release
# waits 7 days (cooldown) before it is proposed, so a hijacked release is likely pulled first.
#
# rebase-strategy: disabled. With the default, Dependabot rebased every open update PR after each
# push to main, and each rebase started about six workflows: on 2026-11-11 the release merge
# rebased nine PRs at once and their runs queued against the v0.16.0 release build. Comment
# `@dependabot rebase` on a PR to bring it up to date before it goes into a batch.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # The Windows Hello bindings (src/platform_auth/windows_bindings.rs) are generated for one
      # windows-core and windows-future version, so the two arrive in one PR.
      windows-bindings:
        patterns: [windows-core, windows-future]
      rust-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned deliberately (exact versions in Cargo.toml): update by hand after review.
      - dependency-name: openqbw
      - dependency-name: opensqlany
      - dependency-name: sha2
      - dependency-name: hmac
      - dependency-name: sha1
      # Major versions that need porting work (gap A21): the build fails on them as they are.
      - dependency-name: aes
        update-types: [version-update:semver-major]
      - dependency-name: cbc
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned deliberately; the icon registry in src/lib/icons.js is checked against this version.
      - dependency-name: lucide-react
      # Major versions that need porting work (gap A21): new config format, new styling engine.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  # End-to-end test tooling (WebdriverIO); never ships in the app.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
