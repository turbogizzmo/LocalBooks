# TEMPORARY (removed before merge): runs the company-file swap tests repeatedly on Windows.
name: Swap stress

on:
  pull_request:
    branches: [main]
  push:
    branches: ['claude/windows-swap-baseline']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  stress:
    name: Swap stress (${{ matrix.platform }} #${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
        run: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: test-${{ matrix.platform }}
          save-if: false
      - name: Windows Defender status
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-MpComputerStatus | Select-Object AMRunningMode, RealTimeProtectionEnabled, OnAccessProtectionEnabled | Format-List
        continue-on-error: true
      - name: Build tests
        working-directory: src-tauri
        run: cargo test --locked --no-run
      - name: Swap, condense and restore tests, three passes
        working-directory: src-tauri
        shell: bash
        run: |
          failed=0
          for pass in 1 2 3; do
            echo "::group::pass $pass"
            cargo test --locked -- db::tests backup::tests condense::tests --nocapture 2>&1 | tee -a ../stress.log || failed=$((failed+1))
            cargo test --locked -- --ignored twenty_restores diag_plain_close --nocapture 2>&1 | tee -a ../stress.log || failed=$((failed+1))
            echo "::endgroup::"
          done
          echo "## Summary"
          grep -E "DIAG:|20 restores took|in use for about|left .* in place|RESTORE_SWAP|test result:|FAILED|panicked" ../stress.log || true
          exit $failed
