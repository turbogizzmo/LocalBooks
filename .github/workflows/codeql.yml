# Static security analysis of the Rust backend, the React frontend and these workflows.
# Findings appear under the repository's Security › Code scanning tab.
#
# Runs on pushes to main, weekly, and on pull requests from batch branches (`batch/*`) or labelled
# `codeql`. Feature PRs reach main only through a batch PR, which is analysed before it merges, so
# analysing every push to every feature PR (1,580 jobs and 6,500 runner minutes in Nov 1-10, 2026,
# the most jobs of any workflow) only queued ahead of the runs that gate merges.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'batch/') ||
      contains(github.event.pull_request.labels.*.name, 'codeql')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
