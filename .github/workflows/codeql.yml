# Static security analysis of the Rust backend, the React frontend and these workflows.
# Findings appear under the repository's Security › Code scanning tab.
#
# Runs on pushes to main, weekly, and on pull requests from batch branches (`batch/*`) or labelled
# `codeql`. Feature PRs reach main only through a batch PR, which is analysed before it merges, so
# analysing every push to every feature PR (1,580 jobs and 6,500 runner minutes in Nov 1-10, 2026,
# the most jobs of any workflow) only queued ahead of the runs that gate merges.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled`, so adding the `codeql` label starts an analysis without another push.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  # Any other label gets a group of its own (the run id), so adding it never cancels an analysis.
  group: >-
    codeql-${{ github.event_name }}-${{
    github.event.action == 'labeled' && github.event.label.name != 'codeql' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Adding a label starts an analysis only when the label is `codeql`; the review:* labels and
    # any other label start nothing.
    if: >-
      (github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'batch/') ||
      contains(github.event.pull_request.labels.*.name, 'codeql')) &&
      (github.event.action != 'labeled' || github.event.label.name == 'codeql')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
