# LocalBooks CI/CD
#
# pull request   → run the Rust test suite on Windows and Linux, and on macOS for batch/* branches
#                  or a PR labelled `macos` (no secrets, read-only).
# push to main   → same tests.
# manual run     → run tests, then build installers; keep workflow artifacts for 7 days.
# push tag v*    → same gates, then build and upload the installers and latest.json to a DRAFT
#                  GitHub Release named after the tag. Review the draft and click "Publish":
#                  installed copies see the update only once the release is published.
#
# Cut a release:   bump "version" in src-tauri/tauri.conf.json (and package.json / Cargo.toml),
#                  commit, then:  git tag v0.2.0 && git push origin v0.2.0
#
# Updates: the app's updater reads releases/latest/download/latest.json and installs a download only
# if it is signed with the update key. The key is stored as the secrets TAURI_SIGNING_PRIVATE_KEY
# and TAURI_SIGNING_PRIVATE_KEY_PASSWORD of the `release` environment (Settings › Environments),
# which only the build job uses; installer builds fail without them. The frontend is built in its
# own step without the key, and npm install scripts are skipped, so the build tools never see it.
#
# Code signing is not configured: macOS Gatekeeper and Windows SmartScreen will warn on the
# resulting installers until Apple Developer ID / Windows signing secrets are added.

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; only the release build may write (to create the draft release).
permissions:
  contents: read

concurrency:
  # A newer push to main supersedes an older run; tag builds always run to completion.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tauri v2 Linux build dependencies (webkit2gtk 4.1 pulls in libsoup 3.0).
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev
    build-essential
    curl
    wget
    file
    libxdo-dev
    libssl-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    patchelf

jobs:
  test:
    name: Test (${{ matrix.platform }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    # The suite took 20 to 40 minutes here in Nov 2026, before SQLite's memory statistics were
    # turned off (src-tauri/.cargo/config.toml); 75 leaves room until new timings are in.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        # A stuck package mirror once held a release build for an hour: fail fast, then re-run.
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: test-${{ matrix.platform }}
          # Only main, tags and manual runs save: each pull request's 600-850 MB copy was scoped to
          # that PR alone and pushed main's caches out of the 10 GB limit (Nov 2026).
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Run ledger test suite
        working-directory: src-tauri
        run: cargo test --locked

  test-macos:
    # A fixed name, so a skipped run still reports as "Test (macos-latest)" for required checks.
    name: Test (macos-latest)
    # macOS runners are few and slow (about 41 minutes for the suite), and a queue of per-PR runs
    # held batch PRs for hours. So on a pull request the macOS suite runs only for batch branches
    # (`batch/*`, which merge every feature PR) or a PR labelled `macos` (adding the label runs the
    # suite at once through macos-label.yml). Pushes to main, tags and manual runs always run it. A
    # skipped job counts as passing for required checks.
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'batch/') ||
      contains(github.event.pull_request.labels.*.name, 'macos')
    permissions:
      contents: read
    # No matrix: with one, GitHub appends "(macos-latest)" to the name and it no longer matches the
    # required check "Test (macos-latest)".
    runs-on: macos-latest
    # The full suite took 70 to 85 minutes on the macOS runner in Nov 2026, so 75 left no room.
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        # A stuck package mirror once held a release build for an hour: fail fast, then re-run.
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: test-macos-latest
          # Saving the macOS cache once hung for 30 minutes after the tests passed and timed the
          # job out (batch #330). Pull requests read the cache; only main, tags and manual runs save it.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Run ledger test suite
        working-directory: src-tauri
        run: cargo test --locked

  build:
    name: Build (${{ matrix.name }})
    needs: [test, test-macos]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # Holds the updater signing key; its deployment rules (tags only, required reviewer) gate this job.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows
            platform: windows-latest
            rust-targets: ''
            args: ''
          - name: Linux
            platform: ubuntu-latest
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${app_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${app_version} (expected v${app_version})."
            exit 1
          fi

      - name: Install Linux dependencies
        # A stuck package mirror once held a release build for an hour: fail fast, then re-run.
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: build-${{ matrix.platform }}
          # A tag's cache can only be read by that same tag, so saving it only takes space from main.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        # No install scripts: the only ones (esbuild, fsevents) are optional, and none should run in
        # the job that holds the signing key.
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # The section under "## [<version>]", up to the next "## [".
          notes=$(awk -v v="## [$version]" '$0 == v { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::warning::CHANGELOG.md has no section for $version; the release notes list downloads only"
          fi
          {
            echo 'body<<NOTES_END'
            echo "$notes"
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - name: Build and package with Tauri
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Only tag builds create a release; manual branch builds upload workflow artifacts below.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: LocalBooks v__VERSION__
          releaseBody: |
            LocalBooks v__VERSION__: local-first, double-entry accounting.

            **What's new**
            ${{ steps.notes.outputs.body }}

            **Downloads**
            - macOS (Apple Silicon and Intel): `.dmg`
            - Windows: `.msi` or `-setup.exe`
            - Linux: `.deb`, `.rpm` or `.AppImage`

            Installation guide: https://turbogizzmo.github.io/LocalBooks/

            Already installed? LocalBooks offers this update on its own (or Settings › Updates ›
            Check for updates), and saves a copy of your company file before upgrading it.

            These builds are not code-signed yet: macOS may require right-click → Open the first
            time, and Windows SmartScreen may ask you to confirm (More info → Run anyway).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          # Windows updates use the per-user setup.exe, matching what the download page recommends;
          # mixing installer types would leave two copies installed.
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: false
          retryAttempts: 1
          # The frontend was built above without secrets; skip beforeBuildCommand (npm run build) so
          # Vite, PostCSS and Tailwind do not run again with the signing key in the environment.
          args: ${{ matrix.args }} --verbose --config '{"build":{"beforeBuildCommand":""}}'

      - name: Collect installer paths
        if: github.ref_type != 'tag'
        id: installers
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const paths = JSON.parse(process.env.ARTIFACT_PATHS);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `paths<<INSTALLERS\n${paths.join('\n')}\nINSTALLERS\n`);
          JS

      - name: Upload installers (7 days)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LocalBooks-${{ matrix.platform }}
          path: ${{ steps.installers.outputs.paths }}
          retention-days: 7
          if-no-files-found: error
