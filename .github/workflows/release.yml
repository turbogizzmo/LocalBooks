# Tillhouse CI/CD
#
# pull request   → run the Rust test suite on Windows and Linux, and on macOS for batch/* branches
#                  or a PR labelled `macos` (no secrets, read-only).
# push to main   → the suite on all three platforms, for every commit (a newer push doesn't cancel
#                  it): these are the results a release of that commit relies on, and these runs
#                  save the Rust caches that pull requests read.
# manual run     → run tests and build installers side by side; keep workflow artifacts for 7 days.
# push tag v*    → don't test the commit again. "Tests passed on main" waits for that commit's
#                  push-to-main run and fails unless its three Test jobs passed; meanwhile the Build
#                  jobs (after the `release` approval) upload installers and latest.json to a DRAFT
#                  GitHub Release named after the tag. Publish the draft as a pre-release only when
#                  the whole run is green; the release check refuses a tag whose commit didn't pass
#                  on main. Installed copies see the update only once the release is latest.
#
# Cut a release:   bump "version" in src-tauri/tauri.conf.json (and package.json / Cargo.toml),
#                  commit, then:  git tag v0.2.0 && git push origin v0.2.0
#
# Updates: the app's updater reads releases/latest/download/latest.json and installs a download only
# if it is signed with the update key. The key is stored as the secrets TAURI_SIGNING_PRIVATE_KEY
# and TAURI_SIGNING_PRIVATE_KEY_PASSWORD of the `release` environment (Settings › Environments),
# which only the build job uses; installer builds fail without them. The frontend is built in its
# own step without the key, and npm install scripts are skipped, so the build tools never see it.
#
# Re-running a Build job (for example one platform failed) is safe before and after the release is
# published: the "Find the release" step hands tauri-action the existing release (draft or
# published), and latest.json keeps the other platforms' entries. Procedure: docs/dev/releasing.md.
#
# Code signing is not configured: macOS Gatekeeper and Windows SmartScreen will warn on the
# resulting installers until Apple Developer ID / Windows signing secrets are added.

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; only the release build may write (to create the draft release).
permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its older run. Pushes to main and tags always run to
  # completion: a tag of a commit relies on that commit's run on main (job `main-tests`).
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tauri v2 Linux build dependencies (webkit2gtk 4.1 pulls in libsoup 3.0).
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev
    build-essential
    curl
    wget
    file
    libxdo-dev
    libssl-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    patchelf

jobs:
  test:
    name: Test (${{ matrix.platform }})
    # A tag's commit was tested by its push to main (job `main-tests` checks that run).
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    # The suite took 20 to 40 minutes here in Nov 2026, before SQLite's memory statistics were
    # turned off (src-tauri/.cargo/config.toml); 75 leaves room until new timings are in.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        # A stuck package mirror once held a release build for an hour: fail fast, then re-run.
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Test files on the work disk (Windows)
        # The suite ran twice as long on Windows as on Linux (776 s against 407 s for PR #408's
        # tests, both on 4 cores), and most tests write company files to the temp folder. That folder
        # is on the runner's system disk C:, the workspace on its work disk D:. With the temp folder
        # next to the workspace and SQLite built optimized (Cargo.toml), PR #409 ran them in 367 s.
        # (Defender's real-time scan is already off on these runners.)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          "TMP=$tmp" >> $env:GITHUB_ENV
          "TEMP=$tmp" >> $env:GITHUB_ENV

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: test-${{ matrix.platform }}
          # Only main, tags and manual runs save: each pull request's 600-850 MB copy was scoped to
          # that PR alone and pushed main's caches out of the 10 GB limit (Nov 2026).
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Run ledger test suite
        working-directory: src-tauri
        run: cargo test --locked

  test-macos:
    # A fixed name, so a skipped run still reports as "Test (macos-latest)" for required checks.
    name: Test (macos-latest)
    # macOS runners are few and slow (about 41 minutes for the suite), and a queue of per-PR runs
    # held batch PRs for hours. So on a pull request the macOS suite runs only for batch branches
    # (`batch/*`, which merge every feature PR) or a PR labelled `macos` (adding the label runs the
    # suite at once through macos-label.yml). Pushes to main, tags and manual runs always run it. A
    # skipped job counts as passing for required checks. Tags rely on the run on main (`main-tests`).
    if: >-
      github.ref_type != 'tag' && (
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'batch/') ||
      contains(github.event.pull_request.labels.*.name, 'macos'))
    permissions:
      contents: read
    # No matrix: with one, GitHub appends "(macos-latest)" to the name and it no longer matches the
    # required check "Test (macos-latest)".
    runs-on: macos-latest
    # The full suite took 70 to 85 minutes on the macOS runner in Nov 2026, so 75 left no room.
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        # A stuck package mirror once held a release build for an hour: fail fast, then re-run.
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: test-macos-latest
          # Saving the macOS cache once hung for 30 minutes after the tests passed and timed the
          # job out (batch #330). Pull requests read the cache; only main, tags and manual runs save it.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Run ledger test suite
        working-directory: src-tauri
        run: cargo test --locked

  main-tests:
    name: Tests passed on main
    # The tagged commit reached main through a pull request whose checks passed, and its push to
    # main ran the suite on all three platforms. Testing it a third time here held every release
    # for about 19 minutes (v0.16.0: Test (windows-latest) 18.5 min before any build started). This
    # job waits for that run's three Test jobs instead, on one small runner, while the Build jobs
    # run. It fails if one failed or was cancelled (re-run it there, then re-run this job), or if
    # the commit has no push-to-main run (tag only commits that are on main).
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Main's macOS job may take up to its own 110-minute limit.
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the Test jobs of this commit's run on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 115); do
            run=$(gh api "repos/$REPO/actions/workflows/release.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=10" \
              --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')
            if [ -z "$run" ]; then
              # The push to main starts its run at the same moment as the tag's; allow a few minutes.
              if [ "$i" -ge 10 ]; then
                echo "::error::$SHA has no push-to-main run of release.yml. Tag only a commit that is on main."
                exit 1
              fi
            else
              # Its three jobs named "Test (<platform>)": ubuntu-latest, windows-latest, macos-latest.
              jobs=$(gh api "repos/$REPO/actions/runs/$run/jobs?filter=latest&per_page=100" \
                --jq '.jobs[] | select(.name | startswith("Test (")) | "\(.name)=\(.status)/\(.conclusion // "")"')
              echo "$(date -u +%H:%M) run $run: $(echo "$jobs" | tr '\n' ' ')"
              done_ok=$(echo "$jobs" | grep -c '=completed/success$' || true)
              bad=$(echo "$jobs" | grep '=completed/' | grep -v '/success$' || true)
              if [ -n "$bad" ]; then
                echo "::error::Main's run for this commit did not pass: $(echo "$bad" | tr '\n' ' '). Re-run its failed jobs (https://github.com/$REPO/actions/runs/$run), then re-run this job."
                exit 1
              fi
              if [ "$done_ok" -eq 3 ]; then
                echo "All three Test jobs passed on main for $SHA: https://github.com/$REPO/actions/runs/$run" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 60
          done
          echo "::error::Main's Test jobs for $SHA did not finish in time."
          exit 1

  build:
    name: Build (${{ matrix.name }})
    # No `needs`: the builds start at once (after the `release` approval) and run beside the tests.
    # A draft release is invisible to installed copies, and nothing is published until the run is
    # green and the release check passes (docs/dev/releasing.md).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # Holds the updater signing key; its deployment rules (tags only, required reviewer) gate this job.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows
            platform: windows-latest
            rust-targets: ''
            args: ''
          - name: Linux
            platform: ubuntu-latest
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${app_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${app_version} (expected v${app_version})."
            exit 1
          fi

      - name: Install Linux dependencies
        # A stuck package mirror once held a release build for an hour: fail fast, then re-run.
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      # No Rust cache. This job never runs on main, and a cache saved by a tag or a manual run can
      # be read only by that same ref, so the `build-*` cache this step used to restore was never
      # saved by anything (none existed in Nov 2026): every release build compiles from scratch.

      - name: Install frontend dependencies
        # No install scripts: the only ones (esbuild, fsevents) are optional, and none should run in
        # the job that holds the signing key.
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # The section under "## [<version>]", up to the next "## [".
          notes=$(awk -v v="## [$version]" '$0 == v { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::warning::CHANGELOG.md has no section for $version; the release notes list downloads only"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<NOTES_END'
            echo "$notes"
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - name: Find the release for this tag
        # tauri-action reuses a release only while it is a draft: for a published one it creates a
        # second draft (v0.15.0's Linux re-run did). So look the tag up here, draft or published,
        # and pass its id; with no release yet, tauri-action creates the draft as before. The
        # platforms already in its latest.json are recorded for the check after the upload.
        if: github.ref_type == 'tag'
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_TOKEN, GITHUB_OUTPUT, TAG } = process.env;
          const api = async (path, accept = 'application/vnd.github+json') => {
            const res = await fetch(`${GITHUB_API_URL}${path}`, {
              headers: { authorization: `Bearer ${GITHUB_TOKEN}`, accept, 'x-github-api-version': '2022-11-28' },
            });
            if (!res.ok) throw new Error(`GET ${path}: HTTP ${res.status}`);
            return res;
          };
          (async () => {
            // A draft can't be fetched by tag, so search the list (drafts included).
            const matches = [];
            for (let page = 1; ; page++) {
              const list = await (await api(`/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}`)).json();
              matches.push(...list.filter((r) => r.tag_name === TAG));
              if (list.length < 100) break;
            }
            const published = matches.filter((r) => !r.draft);
            const drafts = matches.filter((r) => r.draft);
            let release;
            if (published.length > 0) {
              release = published[0];
              if (drafts.length > 0) {
                console.log(`::warning::${TAG} also has draft release(s) ${drafts.map((r) => r.id).join(', ')}; uploading to the published release ${release.id}. Delete the drafts (docs/dev/releasing.md).`);
              }
            } else if (drafts.length === 1) {
              release = drafts[0];
            } else if (drafts.length > 1) {
              throw new Error(`${TAG} has ${drafts.length} draft releases (${drafts.map((r) => r.id).join(', ')}). Delete all but one, then re-run (docs/dev/releasing.md).`);
            }
            let platforms = [];
            if (release) {
              console.log(`Uploading to the ${release.draft ? 'draft' : 'published'} release ${release.id} (${release.html_url}).`);
              const asset = release.assets.find((a) => a.name === 'latest.json');
              if (asset) {
                const json = await (await api(`/repos/${GITHUB_REPOSITORY}/releases/assets/${asset.id}`, 'application/octet-stream')).json();
                platforms = Object.keys(json.platforms || {}).sort();
                console.log(`latest.json lists: ${platforms.join(' ') || '(none)'}`);
              }
            } else {
              console.log(`No release for ${TAG} yet; tauri-action creates the draft.`);
            }
            fs.appendFileSync(GITHUB_OUTPUT, `id=${release ? release.id : ''}\nplatforms=${platforms.join(' ')}\n`);
          })().catch((e) => { console.log(`::error::${e.message}`); process.exit(1); });
          JS

      - name: Build and package with Tauri
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Only tag builds create a release; manual branch builds upload workflow artifacts below.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          # Set when the release already exists (a re-run): upload to it, draft or published. Its
          # name and notes are left as they are.
          releaseId: ${{ steps.release.outputs.id }}
          # The version is written out, not __VERSION__: with releaseId set, tauri-action doesn't
          # fill that in, and the body becomes the notes in latest.json.
          releaseName: Tillhouse v${{ steps.notes.outputs.version }}
          releaseBody: |
            Tillhouse v${{ steps.notes.outputs.version }}: local-first, double-entry accounting.

            **What's new**
            ${{ steps.notes.outputs.body }}

            **Downloads**
            - macOS (Apple Silicon and Intel): `.dmg`
            - Windows: `.msi` or `-setup.exe`
            - Linux: `.deb`, `.rpm` or `.AppImage`

            Installation guide: https://tillhouse.app

            Already installed? Tillhouse offers this update on its own (or Settings › Updates ›
            Check for updates), and saves a copy of your company file before upgrading it.

            These builds are not code-signed yet: macOS may require right-click → Open the first
            time, and Windows SmartScreen may ask you to confirm (More info → Run anyway).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          # Windows updates use the per-user setup.exe, matching what the download page recommends;
          # mixing installer types would leave two copies installed.
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: false
          retryAttempts: 1
          # The frontend was built above without secrets; skip beforeBuildCommand (npm run build) so
          # Vite, PostCSS and Tailwind do not run again with the signing key in the environment.
          args: ${{ matrix.args }} --verbose --config '{"build":{"beforeBuildCommand":""}}'

      - name: Check latest.json kept every platform
        # tauri-action merges this build's platforms into the release's latest.json. Fail if an
        # entry recorded before the build is gone, this platform's is missing, or a URL points
        # outside this release; the manual fix is in docs/dev/releasing.md.
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id || steps.tauri.outputs.releaseId }}
          BEFORE: ${{ steps.release.outputs.platforms }}
          VERSION: ${{ steps.notes.outputs.version }}
          OWN: ${{ runner.os == 'macOS' && 'darwin-aarch64 darwin-x86_64' || runner.os == 'Windows' && 'windows-x86_64' || 'linux-x86_64' }}
        shell: bash
        run: |
          node <<'JS'
          const { GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_TOKEN, RELEASE_ID, BEFORE, VERSION, OWN } = process.env;
          const api = async (path, accept = 'application/vnd.github+json') => {
            const res = await fetch(`${GITHUB_API_URL}${path}`, {
              headers: { authorization: `Bearer ${GITHUB_TOKEN}`, accept, 'x-github-api-version': '2022-11-28' },
            });
            if (!res.ok) throw new Error(`GET ${path}: HTTP ${res.status}`);
            return res;
          };
          const check = async () => {
            if (!RELEASE_ID) return ['no release id from the lookup or from tauri-action'];
            const release = await (await api(`/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}`)).json();
            const asset = release.assets.find((a) => a.name === 'latest.json');
            if (!asset) return [`release ${RELEASE_ID} has no latest.json`];
            const json = await (await api(`/repos/${GITHUB_REPOSITORY}/releases/assets/${asset.id}`, 'application/octet-stream')).json();
            const platforms = json.platforms || {};
            const assetIds = new Set(release.assets.map((a) => String(a.id)));
            const problems = [];
            if (json.version !== VERSION) problems.push(`version is ${json.version}, expected ${VERSION}`);
            const wanted = [...BEFORE.split(' '), ...OWN.split(' ')].filter(Boolean);
            for (const key of wanted) if (!platforms[key]) problems.push(`no entry for ${key}`);
            for (const [key, entry] of Object.entries(platforms)) {
              const id = String(entry.url || '').match(/\/releases\/assets\/(\d+)$/)?.[1];
              if (!id || !assetIds.has(id)) problems.push(`${key} URL ${entry.url} is not an asset of release ${RELEASE_ID}`);
            }
            if (problems.length === 0) console.log(`latest.json for ${VERSION}: ${Object.keys(platforms).sort().join(' ')}`);
            return problems;
          };
          (async () => {
            // The other platforms' jobs may be replacing latest.json at this moment: retry a few times.
            let problems = [];
            for (let attempt = 1; attempt <= 5; attempt++) {
              problems = await check().catch((e) => [e.message]);
              if (problems.length === 0) return;
              console.log(`Attempt ${attempt}: ${problems.join('; ')}`);
              if (attempt < 5) await new Promise((r) => setTimeout(r, 15000));
            }
            for (const p of problems) console.log(`::error::latest.json: ${p}`);
            process.exit(1);
          })();
          JS

      - name: Collect installer paths
        if: github.ref_type != 'tag'
        id: installers
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const paths = JSON.parse(process.env.ARTIFACT_PATHS);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `paths<<INSTALLERS\n${paths.join('\n')}\nINSTALLERS\n`);
          JS

      - name: Upload installers (7 days)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LocalBooks-${{ matrix.platform }}
          path: ${{ steps.installers.outputs.paths }}
          retention-days: 7
          if-no-files-found: error
