# Clippy gate on every pull request and push to main.
#
# Fails on the lint groups that find bugs (correctness, suspicious, perf) and on floating-point
# arithmetic outside the modules that allow it (`#![deny(clippy::float_arithmetic)]` in main.rs).
# Style and complexity lints stay warnings: the code predates them, and fixing them all at once
# would touch nearly every file other branches are working in.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: lint

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D clippy::correctness -D clippy::suspicious -D clippy::perf
