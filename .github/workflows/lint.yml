# Clippy gate on every pull request and push to main.
#
# Fails on any warning, Clippy's or the compiler's (gap A6), and on floating-point arithmetic
# outside the modules that allow it (`#![deny(clippy::float_arithmetic)]` in main.rs). A lint that
# doesn't fit one item is allowed on that item with a `reason`, never for the whole crate.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        # A stuck package mirror once held a release build for an hour: fail fast, then re-run.
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: lint
          # Pull requests read main's cache; saving a copy per PR pushed main's out of the 10 GB limit.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  # Unit tests for the screens' pure helpers (src/**/*.test.js), on Node's built-in test runner, then
  # the screens' lint: a name or component used but never defined (eslint.config.js, gap A15).
  js-unit:
    name: JS unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Install lint tools
        run: npm ci --ignore-scripts

      - name: Lint (undefined names)
        run: npm run lint
