# cargo audit settings (read by the Security audit workflow).
[advisories]
ignore = [
    # rsa (Marvin timing attack, no fixed version). Listed in Cargo.lock only because sqlx declares
    # MySQL support as optional; LocalBooks enables SQLite only, so sqlx-mysql and rsa are never
    # compiled (`cargo tree -i rsa --target all` prints nothing). Re-check if sqlx features change.
    "RUSTSEC-2023-0071",
    # TEMPORARY, until gap R23 in docs/gaps.md is done: libsqlite3-sys 0.30.1 (bundled SQLite before
    # 3.54) can return uninitialized memory when a crafted database is opened with a -wal file of a
    # different page size, which a company file from someone else could carry. The fix is
    # libsqlite3-sys 0.39 or later; remove this line in the PR that upgrades it.
    "RUSTSEC-2026-0459",
]
