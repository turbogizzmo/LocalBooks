[package]
name = "localbooks"
version = "0.16.1"
description = "Tillhouse: local-first double-entry accounting"
edition = "2021"
license = "MIT"
repository = "https://github.com/turbogizzmo/LocalBooks"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes = "=0.8.4"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
base64 = "0.23"
calamine = { version = "0.38", default-features = false }
cbc = { version = "=0.1.2", features = ["alloc"] }
cfb = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
csv = "1"
flate2 = "1"
getrandom = "=0.2.17"
hmac = "=0.12.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-native-tls"] }
libc = "0.2"
openqbw = "=0.1.6"
opensqlany = "=0.2.0"
pdf-extract = "0.12"
# Two-step sign-in (gap R26): the QR code an authenticator app scans, drawn as SVG, no network.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
quick-xml = "0.42"
regex = "1"
rust_xlsxwriter = "0.101"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "=0.10.9"
# TOTP codes (RFC 6238) use HMAC-SHA-1, the only hash every authenticator app supports.
sha1 = "=0.10.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros", "derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
zeroize = "1"
# Save All Attachments writes one zip file (attachment_export.rs); tests also read xlsx and zip files.
zip = { version = "9", default-features = false, features = ["deflate"] }

# SQLite with SQLCipher page encryption (gap R1, docs/plans/encryption-at-rest.md). The same
# libsqlite3-sys sqlx links; Cargo merges the features, so sqlx and every query are unchanged, and a
# file opened without a key is plain SQLite as before. The version stays at the one sqlx 0.8 pins
# (gap R24). macOS uses Apple's CommonCrypto, Linux the system libcrypto that native-tls already
# links, and Windows a copy of OpenSSL built from source.
[target.'cfg(not(windows))'.dependencies]
libsqlite3-sys = { version = "=0.30.1", features = ["bundled-sqlcipher"] }

[target.'cfg(windows)'.dependencies]
libsqlite3-sys = { version = "=0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_WNet", "Win32_System_LibraryLoader", "Win32_System_Mapi"] }
# Export from an installed QuickBooks: the QuickBooks SDK's request processor is a COM object.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_WinRT", "Security_Credentials_UI", "Foundation"] }
# Two-step sign-in with Windows Hello (gap R29, platform_auth.rs): the prompt's asynchronous result.
windows-future = "=0.3.2"

# Two-step sign-in with Touch ID (gap R29, platform_auth.rs): the LocalAuthentication framework.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "block2"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true

[dev-dependencies]
calamine = { version = "0.38", features = ["dates"] }
insta = "1"
# Opens the password-protected PDFs pdf.rs writes, as a reader would (pdf-extract already uses it).
lopdf = { version = "=0.42.0", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }
