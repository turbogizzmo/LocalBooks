[package]
name = "localbooks"
version = "0.7.0"
description = "LocalBooks: local-first double-entry accounting"
edition = "2021"
license = "MIT"
repository = "https://github.com/turbogizzmo/LocalBooks"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
base64 = "0.23"
calamine = { version = "0.37", default-features = false }
cfb = "0.14"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
csv = "1"
flate2 = "1"
getrandom = "=0.2.17"
hmac = "=0.12.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-native-tls"] }
libc = "0.2"
openqbw = "=0.1.6"
opensqlany = "=0.2.0"
pdf-extract = "0.12"
quick-xml = "0.42"
regex = "1"
rust_xlsxwriter = "0.101"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "=0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros", "derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_WNet", "Win32_System_LibraryLoader", "Win32_System_Mapi"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true

[dev-dependencies]
calamine = { version = "0.37", features = ["dates"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
insta = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
